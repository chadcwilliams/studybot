<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="mark">§</span>
      <div class="titles">
        <h1>Study Bot</h1>
        <p id="course-subtitle">Choose a course</p>
      </div>
    </div>
  </header>

  <main class="chat-shell">
    <div class="course-list">
      <a class="course-card" href="./psyc351d/">
        <span class="course-card-title">Psyc 351D</span>
        <span class="course-card-subtitle">Biopsychology</span>
      </a>
      <!-- Add another course by copying the <a class="course-card"> block
           above, pointing it at that course's docs/<course>/ subfolder. -->
    </div>
  </main>
</body>
</html>
